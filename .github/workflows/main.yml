name: Issue 236 isolated validation (no release)
run-name: Issue 236 compatibility and isolated network validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Verify macOS 10.14 toolchain
        run: python3 scripts/verify-release-compatibility.py --sdk
      - name: Install build dependencies in disposable runner
        run: bash install_dependency.sh
      - name: Isolated regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/issue236-validation"
          set -o pipefail
          xcodebuild -workspace ClashFX.xcworkspace -scheme ClashFX \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/issue236-tests" \
            -skip-testing:ClashFXTests/RealCoreMenuIntegrationTests \
            test CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/issue236-validation/tests.log"
      - name: Build universal App and helper without distribution signing
        run: |
          set -o pipefail
          xcodebuild -workspace ClashFX.xcworkspace -scheme ClashFX \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/issue236-build" \
            build CODE_SIGN_IDENTITY='-' ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' \
            | tee "$RUNNER_TEMP/issue236-validation/build.log"
      - name: Verify actual App, helper and core minimum OS versions
        run: |
          set -o pipefail
          python3 scripts/verify-release-compatibility.py \
            --app "$RUNNER_TEMP/issue236-build/Build/Products/Release/ClashFX.app" \
            | tee "$RUNNER_TEMP/issue236-validation/compatibility.log"
      - name: Real core listener readiness across log levels (TUN off)
        run: |
          set -o pipefail
          python3 scripts/verify-isolated-core-readiness.py \
            | tee "$RUNNER_TEMP/issue236-validation/listener-readiness.log"
      - name: Real TUN lifecycle only in disposable hosted runner
        run: |
          set -o pipefail
          CORE="$RUNNER_TEMP/issue236-build/Build/Products/Release/ClashFX.app/Contents/Resources/mihomo_core"
          mkdir -p .ci-validation
          cp "$CORE" .ci-validation/mihomo_core
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            "$(command -v python3)" scripts/verify-ci-tun-lifecycle.py --core "$GITHUB_WORKSPACE/.ci-validation/mihomo_core" \
            | tee "$RUNNER_TEMP/issue236-validation/tun-lifecycle.log"
      - name: Upload validation logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-236-validation-logs
          path: ${{ runner.temp }}/issue236-validation
          retention-days: 7
          if-no-files-found: warn
