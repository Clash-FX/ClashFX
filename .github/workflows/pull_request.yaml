name: ClashX

on: [ pull_request ]

env:
  FASTLANE_SKIP_UPDATE_CHECK: true

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.22'

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: verify deployment toolchain
      run: python3 scripts/verify-release-compatibility.py --sdk

    - name: install deps
      run: |
        bash install_dependency.sh

    - name: free disk space before build
      run: |
        echo "Before cleanup: $(df -h / | tail -1 | awk '{print $4}') available"
        sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
        sudo rm -rf /Library/Frameworks/Mono.framework 2>/dev/null || true
        sudo rm -rf /usr/local/share/dotnet 2>/dev/null || true
        rm -rf ~/Library/Caches/CocoaPods 2>/dev/null || true
        echo "After cleanup: $(df -h / | tail -1 | awk '{print $4}') available"

    - name: isolated regression tests
      run: |
        xcodebuild -workspace ClashFX.xcworkspace -scheme ClashFX \
          -destination 'platform=macOS,arch=arm64' \
          -skip-testing:ClashFXTests/RealCoreMenuIntegrationTests \
          test CODE_SIGNING_ALLOWED=NO

    - name: build
      run: |
        echo "Building ClashFX (PR check, no signing)..."
        xcodebuild clean build \
          -workspace ClashFX.xcworkspace \
          -scheme ClashFX \
          -configuration Release \
          -derivedDataPath ./build_derived_data \
          CODE_SIGN_IDENTITY="-" \
          ENABLE_HARDENED_RUNTIME=NO

        APP_PATH=$(find ./build_derived_data/Build/Products/Release -name "ClashFX.app" -type d | head -n 1)

        if [ -z "$APP_PATH" ]; then
          echo "Error: ClashFX.app not found!"
          find ./build_derived_data -name "ClashFX.app" -type d
          exit 1
        fi

        echo "Build complete! App at: $APP_PATH"
        python3 scripts/verify-release-compatibility.py --app "$APP_PATH"

    - name: Go core tests with race detector
      run: |
        mkdir -p "$RUNNER_TEMP/lab-validation"
        set -o pipefail
        (
          cd ClashFX/goClash
          python3 - <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path.cwd()))
        from core_overlay import core_modfile

        with core_modfile() as modfile:
            env = dict(os.environ, CGO_ENABLED="1", GOMAXPROCS="2")
            for mode in ([], ["-race"]):
                subprocess.run(
                    ["go", "test", "-tags=with_gvisor", *mode,
                     f"-modfile={modfile}", "./..."],
                    check=True,
                    env=env,
                )
        PY
        ) 2>&1 | tee "$RUNNER_TEMP/lab-validation/go-core-race.log"

    - name: Real core listener readiness across log levels
      run: |
        mkdir -p "$RUNNER_TEMP/lab-validation"
        set -o pipefail
        python3 scripts/verify-isolated-core-readiness.py \
          2>&1 | tee "$RUNNER_TEMP/lab-validation/listener-readiness.log"

    - name: Real TUN lifecycle on hosted runner
      run: |
        mkdir -p "$RUNNER_TEMP/lab-validation"
        set -o pipefail
        APP_PATH=$(find ./build_derived_data/Build/Products/Release -name "ClashFX.app" -type d | head -n 1)
        CORE_PATH="$APP_PATH/Contents/Resources/mihomo_core"
        if [ -z "$APP_PATH" ] || [ ! -x "$CORE_PATH" ]; then
          echo "Error: fresh app mihomo_core executable not found at $CORE_PATH"
          exit 1
        fi
        mkdir -p .ci-validation
        cp "$CORE_PATH" .ci-validation/mihomo_core
        sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
          "$(command -v python3)" scripts/verify-ci-tun-lifecycle.py \
          --core "$GITHUB_WORKSPACE/.ci-validation/mihomo_core" \
          2>&1 | tee "$RUNNER_TEMP/lab-validation/tun-lifecycle.log"

    - name: Upload Lab validation logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lab-validation-logs
        path: ${{ runner.temp }}/lab-validation/*.log
        retention-days: 7
        if-no-files-found: warn
